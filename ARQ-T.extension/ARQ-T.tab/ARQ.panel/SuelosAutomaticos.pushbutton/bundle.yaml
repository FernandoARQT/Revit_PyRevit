title: "Suelos\nautomáticos"
tooltip: |
  Crea suelos arquitectónicos a partir de las habitaciones de la planta activa.

  Selecciona las habitaciones y elige tipo de suelo, nivel y desfase. Genera un suelo por habitación o superficies continuas conectadas por puertas, respetando los contornos y huecos. Requiere una vista de planta con nivel y fase definidos.
